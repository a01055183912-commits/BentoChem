name: collect-notices
on:
  schedule:
    - cron: '0 22 * * *'   # 매일 KST 07:00
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/collect.mjs
      - name: commit
        run: |
          git config user.name "notice-bot"
          git config user.email "notice-bot@users.noreply.github.com"
          git add data/notices.json
          git diff --cached --quiet || (git commit -m "chore: update notices" && git push)
